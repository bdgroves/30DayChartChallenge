name: Post the day's chart (X and Bluesky)

# Every morning in April: posts the day's chart if its status in days.yml is `done`.
# Aimed at about 6 AM Pacific: 9 AM on the US East Coast and mid-afternoon in Europe, where much of the
# #30DayChartChallenge crowd is. GitHub often starts scheduled runs late and sometimes
# skips one, so the first run is set for 13:07 UTC (5:07 AM Pacific) and the rest are retries. A retry only
# fills in a platform that hasn't posted yet, and does nothing once the day's chart is out.
# In the November 2026 map challenge GitHub started most scheduled runs 5+ hours late or dropped them, so there is a try
# every 30 minutes from 5:07 AM to 3:37 PM Pacific (13:07-23:37 UTC); the first one that actually runs posts.
on:
  schedule:
    - cron: '7,37 13-23 * 4 *'
  workflow_dispatch:
    inputs:
      mode:
        description: "preview (show what would post, sends nothing) or post"
        type: choice
        options: [preview, post]
        default: preview
      day:
        description: 'Day number, or "all" for preview. Blank = today (Pacific).'
        required: false
      check_x:
        description: "Preview: also sign in to X to test the keys (X bills about a cent each time)"
        type: boolean
        default: false
      only:
        description: "Post to one platform only (blank = both)"
        type: choice
        options: ['', x, bluesky]
        default: ''

permissions:
  contents: write

concurrency:
  group: dcc-2027
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q pyyaml pillow requests requests-oauthlib atproto

      - name: Preview
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        env:
          # same secret names as weather-report-bot (TWITTER_*, BLUESKY_*); X_* / BSKY_* also work
          X_API_KEY: ${{ secrets.X_API_KEY || secrets.TWITTER_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET || secrets.TWITTER_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN || secrets.TWITTER_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET || secrets.TWITTER_ACCESS_SECRET }}
          BSKY_HANDLE: ${{ vars.BSKY_HANDLE || secrets.BLUESKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD || secrets.BLUESKY_APP_PASSWORD }}
          CHECK_X_LOGIN: ${{ inputs.check_x }}
        run: python 2027/toolkit/post.py --preview "${{ inputs.day || 'all' }}"

      - name: Post
        if: github.event_name == 'schedule' || inputs.mode == 'post'
        env:
          # same secret names as weather-report-bot (TWITTER_*, BLUESKY_*); X_* / BSKY_* also work
          X_API_KEY: ${{ secrets.X_API_KEY || secrets.TWITTER_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET || secrets.TWITTER_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN || secrets.TWITTER_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET || secrets.TWITTER_ACCESS_SECRET }}
          BSKY_HANDLE: ${{ vars.BSKY_HANDLE || secrets.BLUESKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD || secrets.BLUESKY_APP_PASSWORD }}
        run: |
          args=""
          [ -n "${{ inputs.day }}" ] && args="$args --day ${{ inputs.day }}"
          [ -n "${{ inputs.only }}" ] && args="$args --only ${{ inputs.only }}"
          rc=0
          python 2027/toolkit/post.py $args || rc=$?
          echo "RC=$rc" > rc.txt

      - name: Record what went out (posted.json, status in days.yml, gallery)
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'post')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 2027/posted.json 2027/days.yml 2>/dev/null || true
          git diff --staged --quiet && exit 0
          pip install -q pyyaml pillow >/dev/null
          python 2027/toolkit/build.py
          git add 2027
          git commit -q -m "2027: posted day ${{ inputs.day || 'of the day' }} [skip ci]"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done

      - name: Fail the run if a platform failed (GitHub emails you)
        if: github.event_name == 'schedule' || inputs.mode == 'post'
        run: grep -q 'RC=0' rc.txt
